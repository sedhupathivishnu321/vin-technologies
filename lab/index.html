<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>LEARNERS LAB — Electronics simulator | VIN Technologies</title>
<meta name="description" content="A virtual electronics laboratory that runs in your browser or installs as an app: breadboard-style circuits, live sliders, oscilloscope, graphs and 100+ lab experiments.">
<meta name="theme-color" content="#0f141c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Learners Lab">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="lab.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-flask" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6L5 19a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-10V3M7.5 15h9"/></symbol>
  <symbol id="i-chip" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M9.5 3v4M14.5 3v4M9.5 17v4M14.5 17v4M3 9.5h4M3 14.5h4M17 9.5h4M17 14.5h4"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 4v16h16M8 15l3-4 3 2 5-6"/></symbol>
  <symbol id="i-scope" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M5.5 11c1.5-4 2.5-4 3.5 0s2 4 3.5 0 2-4 3.5 0M8 21h8"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z" fill="currentColor"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5M20 9H10a6 6 0 0 0 0 12h3"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
  <symbol id="i-wire" viewBox="0 0 24 24"><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="5.5" r="2.5"/><path d="M7.5 16.5l9-9"/></symbol>
  <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></symbol>
  <symbol id="i-mirror" viewBox="0 0 24 24"><path d="M12 3v18M8 7l-5 5 5 5zM16 7l5 5-5 5z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="19" r="1.6" fill="currentColor"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol>
  <symbol id="i-open" viewBox="0 0 24 24"><path d="M12 16V5M7 9l5-5 5 5M5 20h14"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11"/></symbol>
  <symbol id="i-install" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M12 8v6M9.5 12l2.5 2.5 2.5-2.5"/></symbol>
</defs></svg>

<div id="boot"><div class="boot-card"><img src="icons/icon-192.png" alt="" class="boot-icon"><div class="boot-title">LEARNERS LAB</div><div class="bar"><i id="bootbar"></i></div><div id="boottext">Starting</div></div></div>

<div id="app">
  <header class="appbar">
    <a class="iconbtn" href="../" aria-label="Back to VIN Technologies"><svg class="ic"><use href="#i-back"/></svg></a>
    <div class="titles"><div id="doctitle" class="t1">LEARNERS LAB</div><div id="status" class="t2">Loading</div></div>
    <button id="bLive" class="chip toggle" aria-pressed="false" title="Re-run automatically whenever a value changes (Ctrl+L)"><svg class="ic sm"><use href="#i-bolt"/></svg><span>Live</span></button>
    <button id="bMenu" class="iconbtn" aria-label="More"><svg class="ic"><use href="#i-more"/></svg></button>
    <div id="menu" class="menu" hidden>
      <button id="bSave"><svg class="ic sm"><use href="#i-save"/></svg>Save circuit</button>
      <button id="bOpen"><svg class="ic sm"><use href="#i-open"/></svg>Open circuit</button>
      <button id="bInstall" hidden><svg class="ic sm"><use href="#i-install"/></svg>Install app</button>
      <a href="../#app"><svg class="ic sm"><use href="#i-book"/></svg>Desktop app</a>
      <input id="fOpen" type="file" accept=".json,application/json" hidden>
    </div>
  </header>

  <nav class="nav" id="nav" aria-label="Sections">
    <button data-p="exp" class="on"><svg class="ic"><use href="#i-flask"/></svg><span>Labs</span></button>
    <button data-p="parts"><svg class="ic"><use href="#i-chip"/></svg><span>Parts</span></button>
    <button data-p="ctl"><svg class="ic"><use href="#i-sliders"/></svg><span>Tune</span></button>
    <button data-p="res"><svg class="ic"><use href="#i-chart"/></svg><span>Results</span><i class="dot" id="resDot" hidden></i></button>
    <button data-p="scope"><svg class="ic"><use href="#i-scope"/></svg><span>Scope</span></button>
  </nav>

  <div class="body" id="body">
    <section class="stage" id="stage">
      <svg id="cv" xmlns="http://www.w3.org/2000/svg" tabindex="0">
        <defs>
          <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="0" cy="0" r="1" class="gdot"/></pattern>
          <radialGradient id="glowR"><stop offset="0" stop-color="#e11d1d" stop-opacity=".95"/><stop offset=".5" stop-color="#e11d1d" stop-opacity=".45"/><stop offset="1" stop-color="#e11d1d" stop-opacity="0"/></radialGradient>
          <radialGradient id="glowG"><stop offset="0" stop-color="#22c55e" stop-opacity=".95"/><stop offset=".5" stop-color="#22c55e" stop-opacity=".45"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></radialGradient>
          <radialGradient id="glowY"><stop offset="0" stop-color="#eab308" stop-opacity=".95"/><stop offset=".5" stop-color="#eab308" stop-opacity=".45"/><stop offset="1" stop-color="#eab308" stop-opacity="0"/></radialGradient>
          <radialGradient id="glowB"><stop offset="0" stop-color="#2563eb" stop-opacity=".95"/><stop offset=".5" stop-color="#2563eb" stop-opacity=".45"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
        </defs>
        <rect id="gridrect" x="-20000" y="-20000" width="40000" height="40000" fill="url(#grid)"/>
        <g id="world"><g id="wires"></g><g id="comps"></g><g id="over"></g></g>
      </svg>
      <div class="tools" id="tools">
        <button id="bZin" class="fab sm" aria-label="Zoom in"><svg class="ic"><use href="#i-plus"/></svg></button>
        <button id="bZout" class="fab sm" aria-label="Zoom out"><svg class="ic"><use href="#i-minus"/></svg></button>
        <button id="bFit" class="fab sm" aria-label="Fit to screen"><svg class="ic"><use href="#i-fit"/></svg></button>
      </div>
      <div class="tools left" id="tools2">
        <button id="bUndo" class="fab sm" aria-label="Undo"><svg class="ic"><use href="#i-undo"/></svg></button>
        <button id="bRedo" class="fab sm" aria-label="Redo"><svg class="ic"><use href="#i-redo"/></svg></button>
        <button id="bWire" class="fab sm toggle" aria-label="Wire tool" aria-pressed="false"><svg class="ic"><use href="#i-wire"/></svg></button>
      </div>
    </section>

    <div class="floats" id="floats">
      <div class="ctx" id="ctx" hidden>
        <span id="ctxName" class="ctxname"></span>
        <button id="bEdit" aria-label="Edit values"><svg class="ic"><use href="#i-edit"/></svg><span>Edit</span></button>
        <button id="bRot" aria-label="Rotate"><svg class="ic"><use href="#i-rotate"/></svg><span>Rotate</span></button>
        <button id="bMir" aria-label="Mirror"><svg class="ic"><use href="#i-mirror"/></svg><span>Mirror</span></button>
        <button id="bDel" class="danger" aria-label="Delete"><svg class="ic"><use href="#i-trash"/></svg><span>Delete</span></button>
      </div>
      <span class="grow"></span>
      <button id="bRun" class="fab run" aria-label="Run simulation"><svg class="ic play"><use href="#i-play"/></svg><span class="spin"></span><b>Run</b></button>
    </div>
    <div id="hint" class="hint"></div>
    <div id="toast" class="toast" role="status"></div>

    <aside class="sheet" id="sheet" data-state="closed">
      <div class="grab" id="grab"><i></i></div>
      <div class="shead">
        <div id="stitle" class="stitle">Labs</div>
        <div id="seg" class="seg" hidden></div>
        <button id="sclose" class="iconbtn" aria-label="Close"><svg class="ic"><use href="#i-close"/></svg></button>
      </div>
      <div class="sbody" id="sbody">
        <div id="pExp" class="page">
          <div class="searchbox"><svg class="ic sm"><use href="#i-search"/></svg><input id="expSearch" type="search" placeholder="Search experiments" aria-label="Search experiments"></div>
          <div id="expChips" class="chips"></div>
          <div id="expList" class="cards"></div>
        </div>
        <div id="pGuide" class="page" hidden><div id="rinfo"></div></div>
        <div id="pParts" class="page" hidden>
          <div class="searchbox"><svg class="ic sm"><use href="#i-search"/></svg><input id="partSearch" type="search" placeholder="Search parts" aria-label="Search parts"></div>
          <div id="partChips" class="chips"></div>
          <div id="partList" class="tiles"></div>
        </div>
        <div id="pCtl" class="page" hidden><div id="rctl"></div></div>
        <div id="pProp" class="page" hidden><div id="rprop"></div></div>
        <div id="pRes" class="page" hidden><div id="rres"></div></div>
        <div id="pGraph" class="page" hidden>
          <div id="rgraph">
            <canvas id="gcv"></canvas>
            <div id="greadout" class="readout"></div>
            <div class="plotbar"><label class="check"><input type="checkbox" id="gLogX"><span>Log X</span></label><label class="check"><input type="checkbox" id="gLogY"><span>Log Y</span></label><span class="grow"></span><button id="gCsv" class="pill">CSV</button><button id="gPng" class="pill">PNG</button></div>
            <div id="gsig" class="siglist"></div>
          </div>
        </div>
        <div id="pScope" class="page" hidden>
          <div id="scopeNone" class="empty">Add an oscilloscope to the circuit and run it.</div>
          <div id="scopeBox" hidden>
            <canvas id="scv"></canvas>
            <div class="scopeknobs" id="sknobs"></div>
            <div id="smeas" class="meas"></div>
          </div>
        </div>
      </div>
    </aside>
  </div>
</div>
<script src="lab.js"></script>
</body>
</html>
