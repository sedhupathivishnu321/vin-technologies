<div id="app">
  <header class="ribbon">
    <div class="r1">
      <a class="brand" href="../" title="Circuits"><img src="../icons/icon-192.png" alt=""><b>LEARNERS LAB</b><span class="sub">Trainer Kits</span></a>
      <div class="modeseg" id="kitseg" role="tablist"><button data-kit="8085" class="on">8085</button><button data-kit="8051">8051</button></div>
      <span class="vsep"></span>
      <button class="rb" id="bEx" title="Experiments"><svg class="ic sm"><use href="#i-flask"/></svg><span class="t">Experiments</span><svg class="ic xs"><use href="#i-chev"/></svg></button>
      <span class="vsep"></span>
      <button class="rb" id="bAsm" title="Assemble and load (F7)"><svg class="ic sm"><use href="#i-build"/></svg><span class="t">Assemble</span></button>
      <button class="rb go" id="bRun" title="Run (F5)"><svg class="ic sm"><use href="#i-play"/></svg><span>Run</span></button>
      <button class="rb" id="bStep" title="Step (F10)"><svg class="ic sm"><use href="#i-step"/></svg><span class="t">Step</span></button>
      <button class="rb" id="bOver" title="Step over calls (F8)"><svg class="ic sm"><use href="#i-over"/></svg><span class="t">Over</span></button>
      <button class="rb" id="bReset" title="Reset the CPU and devices (program stays in memory)"><svg class="ic sm"><use href="#i-reset"/></svg><span class="t">Reset</span></button>
      <span class="vsep"></span>
      <label class="inl" title="How fast simulated time runs"><span class="mute t">Speed</span>
        <select id="speed">
          <option value="r:2">2 instr/s</option>
          <option value="r:10">10 instr/s</option>
          <option value="r:100">100 instr/s</option>
          <option value="m:1" selected>Real time 1x</option>
          <option value="m:10">10x</option>
          <option value="m:100">100x</option>
          <option value="m:1000">Max</option>
        </select></label>
      <span class="grow"></span>
      <span class="clock" id="clock" title="Simulated time / effective speed">0.000 s</span>
      <button class="rb sq" id="bMore" title="More"><svg class="ic sm"><use href="#i-more"/></svg></button>
      <button class="rb sq" id="bTheme" title="Light / dark"><svg class="ic sm"><use href="#i-moon"/></svg></button>
      <a class="rb" href="../" title="Circuit simulator">Circuits</a>
      <a class="rb" href="../network/" title="Network simulator">Networks</a>
    </div>
  </header>

  <div class="work" id="work">
    <section class="pane left" id="pLeft">

      <div class="pg" id="pgCode">
        <div class="ed">
          <div class="gutter" id="gutter"><pre id="gnums"></pre></div>
          <div class="edmain"><div class="curline" id="curline"></div><textarea id="src" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off"></textarea></div>
        </div>
        <div class="problems" id="problems"></div>
      </div>
      <div class="pg" id="pgList" hidden><pre class="list" id="listing"></pre></div>
      <div class="pg lab" id="pgLab" hidden></div>
      <div class="pg lab" id="pgHelp" hidden></div>
    </section>

    <section class="pane mid" id="pMid">
      <div class="board" id="board"></div>
    </section>

    <aside class="pane right" id="pRight">
      <div class="tabs" id="tabsRight"><button data-t="cpu" class="on">CPU</button><button data-t="mem">Memory</button><button data-t="dis">Disassembly</button><button data-t="io">Chips</button></div>
      <div class="pg" id="pgCpu"></div>
      <div class="pg" id="pgMem" hidden></div>
      <div class="pg" id="pgDis" hidden></div>
      <div class="pg" id="pgIo" hidden></div>
